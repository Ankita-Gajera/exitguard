[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[lint]
# Style notes that do not apply here: lowercase `owner` immutables are part of the public interface, and the
# keccak and modifier suggestions trade readability for a few gas.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256", "unwrapped-modifier-logic"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
